# INACTIVE TEMPLATE: review, replace placeholders, and authorize App setup/live
# writes separately before copying to .github/workflows/ in a consumer.
# Replace repository identity and onboarding SHAs with your own reviewed values.
# githubRelease publishes the tagged changelog as a stable GitHub Release/latest.
# selfUpgrade is reserved for release-log's own caller; do not enable for consumers.
# Self-use additionally requires App Actions read and Workflows write.
name: Rolling release caller
on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: lhajoosten/release-log/.github/workflows/rolling-release.yml@REVIEWED_FULL_COMMIT_SHA
    with:
      tool-sha: REVIEWED_FULL_COMMIT_SHA
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      # Contents/PR write on the App; keep its installation repository-limited.
      # For upgrades, explicitly retain reviewed producers of existing proposals:
      # verification-runtimes: '[{"sha":"REVIEWED_PREDECESSOR_FULL_SHA","legacy":true}]'
      write: false
      configuration: >-
        {"schemaVersion":2,"repository":"OWNER/REPOSITORY","repositoryId":123456789,"releaseBranch":"main","releasePolicy":"release-policy-v1","contextPolicy":"required","githubRelease":true,"changelog":{"verbosity":"concise","format":"compact"},"bootstrap":{"baselineSha":"BASELINE_FULL_COMMIT_SHA","onboardingSha":"ONBOARDING_FULL_COMMIT_SHA"}}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
