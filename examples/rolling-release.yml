# Review this template before installing it. Set RELEASE_LOG_WRITE_ENABLED=false
# before rehearsing the caller. Approve the repository-scoped App separately.
name: Rolling release caller
on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  release:
    uses: lhajoosten/rolling-release/.github/workflows/consumer-release.yml@consumer-v1
    with:
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write-enabled: ${{ vars.RELEASE_LOG_WRITE_ENABLED != 'false' }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY || secrets.RELEASE_LOG_PRIVATE_KEY }}
