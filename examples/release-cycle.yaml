# Copy into .github/workflows/rolling-release.yaml after reviewing settings and provider ref.
name: Rolling Release
run-name: release:${{ github.event.pull_request.number || inputs.retry-pr || 'preview' }}
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      retry-pr:
        description: Merged release PR number to retry (leave empty for preview)
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  proposal-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: lhajoosten/rolling-release/.github/workflows/release-quality.yaml@consumer-v1
    with:
      bot: ${{ vars.ROLLING_RELEASE_BOT }}
      start-sha: ${{ vars.ROLLING_RELEASE_START_SHA }}

  release:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: write
      pull-requests: write
      packages: write
    uses: lhajoosten/rolling-release/.github/workflows/release-cycle.yaml@consumer-v1
    with:
      retry-pr: ${{ inputs.retry-pr }}
      write-enabled: ${{ vars.RELEASE_LOG_WRITE_ENABLED }}
      bot: ${{ vars.ROLLING_RELEASE_BOT }}
      start-sha: ${{ vars.ROLLING_RELEASE_START_SHA }}
      image-enabled: ${{ vars.ROLLING_RELEASE_IMAGE_ENABLED }}
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
