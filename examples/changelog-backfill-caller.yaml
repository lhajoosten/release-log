name: Rebuild changelog
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  backfill:
    uses: lhajoosten/rolling-release/.github/workflows/changelog-backfill.yaml@consumer-v1
    with:
      bot: ${{ vars.ROLLING_RELEASE_BOT }}
      start-sha: ${{ vars.ROLLING_RELEASE_START_SHA }}
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
