# INACTIVE TEMPLATE: replace the pins and use the rolling-release caller's configuration JSON.
# Use the release branch as a literal GitHub Actions branch filter.
name: Release Log metadata
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-log-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-log:
    uses: lhajoosten/rolling-release/.github/workflows/release-metadata.yml@REVIEWED_FULL_COMMIT_SHA
    with:
      tool-sha: REVIEWED_FULL_COMMIT_SHA
      configuration: >-
        {"schemaVersion":2,"repository":"OWNER/REPOSITORY","repositoryId":123456789,"releaseBranch":"main","releasePolicy":"release-policy-v1","contextPolicy":"required","githubRelease":true,"changelog":{"verbosity":"concise","format":"compact"},"bootstrap":{"baselineSha":"BASELINE_FULL_COMMIT_SHA","onboardingSha":"ONBOARDING_FULL_COMMIT_SHA"}}
