# Use the release branch as a literal GitHub Actions branch filter.
name: Release Log metadata
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-log-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-log:
    uses: lhajoosten/rolling-release/.github/workflows/release-metadata.yml@consumer-v1
    with:
      release-branch: main
