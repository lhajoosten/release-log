name: Container security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: container-security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: container-security
    # Pause only the PR that changes scan policy for the pending v0.6.0 release.
    if: >-
      (
        false ||
        github.event_name != 'pull_request' ||
        github.repository != 'lhajoosten/release-log' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.ref != 'ci/pause-container-scans' ||
        github.event.pull_request.base.ref != 'main' ||
        github.event.pull_request.base.sha != '21662200936919c1df83f9d3ce8fccee42fa3dc4'
      ) && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.ref != 'release-log/main' ||
        vars.RELEASE_BOT_USER_ID == '' ||
        format('{0}', github.event.pull_request.user.id) != vars.RELEASE_BOT_USER_ID
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Identify generated release merge
        id: release
        if: github.event_name == 'push' && vars.RELEASE_BOT_USER_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
          RELEASE_BOT_USER_ID: ${{ vars.RELEASE_BOT_USER_ID }}
        run: |
          # Skip only when this push lands a single, positively identified release PR.
          if [[ "$(git rev-parse --verify HEAD^1 2>/dev/null)" != "$PREVIOUS_SHA" ]]; then
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg bot "$RELEASE_BOT_USER_ID" '
              any(.[]; .merged_at != null and .merge_commit_sha == $sha and
                .base.ref == "main" and .base.repo.full_name == $repo and
                .head.ref == "release-log/main" and .head.repo.full_name == $repo and
                (.user.id | tostring) == $bot)
            ' >/dev/null; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: &run-scan steps.release.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        if: *run-scan
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        if: *run-scan
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the actual packaged image locally
        if: *run-scan
        run: pnpm container:build --tag release-log-security:scan

      - name: Scan the image with checksum-pinned Syft and Grype
        if: *run-scan
        run: |
          mkdir -p reports
          pnpm container:scan --image release-log-security:scan --output reports/container-security --allow-openssl-backport

      - name: Preserve inventory, findings and failure evidence
        if: always() && steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/container-security/
          if-no-files-found: warn
          retention-days: 14
