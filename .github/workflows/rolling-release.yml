name: Rolling Release writer

on:
  workflow_call:
    inputs:
      tool-sha:
        description: Reviewed full commit of lhajoosten/rolling-release containing this CLI
        required: true
        type: string
      verification-runtimes:
        description: Trusted producer SHA/legacy pairs for prior proposal verification (executable authority)
        default: "[]"
        type: string
      consumer:
        description: Use the consumer dispatch preview and read-only token for paused writes
        default: false
        type: boolean
      settings-source:
        description: Release-branch commit holding the resolved settings
        type: string
      historical-configurations:
        description: Reviewed consumer configurations for completed release verification
        default: "[]"
        type: string
      configuration:
        description: Trusted release input configuration JSON, supplied by the caller
        required: true
        type: string
      bot-user-id:
        description: Expected numeric GitHub App bot account ID
        required: true
        type: string
      release-branch:
        required: true
        type: string
      app-id:
        required: true
        type: string
      write:
        description: Separately approved live writes (default is dry-run)
        default: false
        type: boolean
    secrets:
      app-private-key:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-log-${{ github.repository }}-${{ inputs.release-branch }}
  cancel-in-progress: false

jobs:
  roll:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', inputs.release-branch)) ||
      ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request') &&
       github.event.action == 'closed' && github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == inputs.release-branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a pinned tool revision
        env:
          TOOL_SHA: ${{ inputs.tool-sha }}
        run: '[[ "$TOOL_SHA" =~ ^[a-f0-9]{40}$ ]]'

      - name: Check out only reviewed tool code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhajoosten/rolling-release
          ref: ${{ inputs.tool-sha }}
          path: tool
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tool/.node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: tool/package.json
          cache: false

      - name: Build and install the pinned tarball without consumer code
        working-directory: tool
        env:
          TOOL_SHA: ${{ inputs.tool-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TOOL_SHA"
          pnpm install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/release-package" "$RUNNER_TEMP/release-cli"
          pnpm pack --out "$RUNNER_TEMP/release-package/release-log.tgz"
          tar -xzf "$RUNNER_TEMP/release-package/release-log.tgz" --strip-components=1 --directory "$RUNNER_TEMP/release-cli"
          cp "$RUNNER_TEMP/release-cli/dist/dependency-lock.txt" "$RUNNER_TEMP/release-cli/pnpm-lock.yaml"
          pnpm --dir "$RUNNER_TEMP/release-cli" install --offline --prod --frozen-lockfile --ignore-scripts

      - name: Validate trusted caller configuration
        id: configuration
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          BOT_USER_ID: ${{ inputs.bot-user-id }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          RELEASE_APP_ID: ${{ inputs.app-id }}
          CONSUMER: ${{ inputs.consumer }}
          HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFile, writeFile } from 'node:fs/promises';
          const { parseReleaseInputConfiguration } = await import(`${process.env.RUNNER_TEMP}/release-cli/dist/src/release-snapshot.js`);
          const { parseReleaseAutomation } = await import(`${process.env.RUNNER_TEMP}/release-cli/dist/src/release-proposal.js`);
          const config = parseReleaseInputConfiguration(JSON.parse(process.env.CONFIGURATION));
          const providerAliases = ['lhajoosten/release-log', 'lhajoosten/rolling-release'];
          const providerIdentityMatches = providerAliases.includes(config.repository) && providerAliases.includes(process.env.GITHUB_REPOSITORY) && config.repositoryId === 1449550207 && config.repositoryId === Number(process.env.GITHUB_REPOSITORY_ID);
          if ((!providerIdentityMatches && config.repository !== process.env.GITHUB_REPOSITORY) || config.repositoryId !== Number(process.env.GITHUB_REPOSITORY_ID) || config.releaseBranch !== process.env.RELEASE_BRANCH) throw new Error('Caller repository/branch mismatch');
          await appendFile(process.env.GITHUB_OUTPUT, `self-upgrade=${config.selfUpgrade === true}\n`);
          await writeFile(`${process.env.RUNNER_TEMP}/release-config.json`, JSON.stringify(config));
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            if (process.env.GITHUB_REF !== 'refs/heads/' + config.releaseBranch) throw new Error('Manual preflight requires the configured release branch');
            const appId = process.env.RELEASE_APP_ID;
            const canProbe = /^[1-9]\d*$/.test(appId) && Number.isSafeInteger(Number(appId)) && process.env.HAS_APP_KEY === 'true';
            await appendFile(process.env.GITHUB_OUTPUT, `probe-app=${canProbe}\n`);
          }
          if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || process.env.CONSUMER === 'true') {
            const automation = parseReleaseAutomation({ schemaVersion: 1, botUserId: Number(process.env.BOT_USER_ID) });
            await writeFile(`${process.env.RUNNER_TEMP}/release-automation.json`, JSON.stringify(automation));
          }
          JS

      - name: Check out current release source as data with complete tags and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/heads/{0}', inputs.release-branch) }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the reviewed settings still apply to the queued run
        if: inputs.consumer
        env:
          SETTINGS_SOURCE: ${{ inputs.settings-source }}
        run: |
          [[ "$SETTINGS_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          if ! git -C source merge-base --is-ancestor "$SETTINGS_SOURCE" HEAD ||
             ! git -C source diff --quiet "$SETTINGS_SOURCE" HEAD -- .release-log/settings.json; then
            echo "The release branch changed settings or diverged while this run was queued. Rerun from current release history." >&2
            exit 1
          fi

      - name: Resolve needed producer runtimes from reviewed catalog
        if: inputs.consumer
        id: replay
        working-directory: tool
        env:
          TOOL_SHA: ${{ inputs.tool-sha }}
          CATALOG: ${{ inputs.verification-runtimes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/select-consumer-producers.ts

      - name: Install explicitly trusted producer runtimes before credentials
        working-directory: tool
        env:
          TOOL_SHA: ${{ inputs.tool-sha }}
          CONFIGURATION: ${{ inputs.configuration }}
          VERIFICATION_RUNTIMES: ${{ steps.replay.outputs.runtimes || inputs.verification-runtimes }}
          HISTORICAL_CONFIGURATIONS: ${{ inputs.historical-configurations }}
        run: node scripts/install-producer-runtimes.ts

      - name: Check App installation access on this repository
        if: github.event_name == 'workflow_dispatch' && !inputs.consumer && steps.configuration.outputs.probe-app == 'true'
        id: installation
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-metadata: read

      # Mint after queueing and tool installation. Never expose the key/token to
      # consumer dependency scripts, source code, or a PR-head checkout.
      - name: Mint a short-lived token with the required permissions
        if: >-
          (github.event_name != 'workflow_dispatch' && (!inputs.consumer || inputs.write)) ||
          steps.installation.outcome == 'success'
        id: app
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-actions: ${{ steps.configuration.outputs.self-upgrade == 'true' && 'read' || '' }}
          permission-workflows: ${{ steps.configuration.outputs.self-upgrade == 'true' && 'write' || '' }}
          permission-contents: write
          permission-pull-requests: write

      - name: Mint a read-only token for a paused merge run
        if: inputs.consumer && !inputs.write && github.event_name != 'workflow_dispatch'
        id: preview-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: read
          permission-pull-requests: read

      - name: Preview the current or initial release cycle
        if: inputs.consumer && github.event_name == 'workflow_dispatch'
        working-directory: tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOL_SHA: ${{ inputs.tool-sha }}
        run: node scripts/preview-consumer-release.ts

      - name: Rehearse initialization on the captured release branch
        if: github.event_name == 'workflow_dispatch' && !inputs.consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_LOG_APP_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_LOG_PREFLIGHT_ACTIONS: "true"
          RELEASE_LOG_PREFLIGHT_APP_ID: ${{ inputs.app-id }}
          RELEASE_LOG_PREFLIGHT_BOT_ID: ${{ inputs.bot-user-id }}
          RELEASE_LOG_PREFLIGHT_HAS_KEY: ${{ secrets.app-private-key != '' }}
          RELEASE_LOG_PREFLIGHT_INSTALLATION: ${{ steps.installation.outcome }}
          RELEASE_LOG_PREFLIGHT_INSTALLATION_TOKEN: ${{ steps.installation.outputs.token }}
          RELEASE_LOG_PREFLIGHT_PERMISSIONS: ${{ steps.app.outcome }}
          RELEASE_LOG_PREFLIGHT_APP_SLUG: ${{ steps.installation.outputs.app-slug }}
          TOOL_SHA: ${{ inputs.tool-sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          node "$RUNNER_TEMP/release-cli/dist/src/cli.js" preflight \
            --producer-runtimes "$RUNNER_TEMP/release-producer-runtimes.json" \
            --config "$RUNNER_TEMP/release-config.json" \
            --repository "$GITHUB_WORKSPACE/source" \
            --source "$GITHUB_SHA" --producer-sha "$TOOL_SHA" --initial-version 0.1.0

      - name: Route the merge through the packaged CLI
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_LOG_APP_TOKEN: ${{ steps.app.outputs.token || steps.preview-app.outputs.token }}
          RELEASE_WRITE: ${{ inputs.write }}
          RELEASE_LOG_CONSUMER_RETRY_READS: ${{ inputs.consumer }}
        run: |
          mode=--dry-run
          if [ "$RELEASE_WRITE" = true ]; then mode=--write; fi
          node "$RUNNER_TEMP/release-cli/dist/src/cli.js" roll \
            --producer-runtimes "$RUNNER_TEMP/release-producer-runtimes.json" \
            --config "$RUNNER_TEMP/release-config.json" \
            --automation "$RUNNER_TEMP/release-automation.json" \
            --repository "$GITHUB_WORKSPACE/source" \
            --event "$GITHUB_EVENT_PATH" "$mode"
