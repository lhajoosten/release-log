name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: container
    if: &needs-full-ci >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'release-log/main' ||
      vars.RELEASE_BOT_USER_ID == '' ||
      format('{0}', github.event.pull_request.user.id) != vars.RELEASE_BOT_USER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and smoke-test the local image without registry publication
        run: pnpm check:container

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The rollout PR lands the policy. Later PRs use their base copy.
      - name: Check for trusted complexity policy
        if: github.event_name == 'pull_request'
        id: complexity-policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          policy_entry=$(git ls-tree "$BASE_SHA" -- .lint-action.json)
          if [[ -n "$policy_entry" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report TypeScript complexity
        if: github.event_name != 'pull_request' || steps.complexity-policy.outputs.available == 'true'
        uses: lhajoosten/lint-action@c8719d5d0b2951311f3c6a883cefa1214dffaa29

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify formatting, lint, types, and tests
        if: *needs-full-ci
        run: pnpm verify

      - name: Reject stale release proposals
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release-log/main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:release-proposal-source --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm check:pr-title

      - name: Validate non-merge PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:commit-range --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Validate non-merge commits pushed to main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm check:commit-range --from "$BASE_SHA" --to "$HEAD_SHA"
