name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: container
    if: &needs-full-ci >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'release-log/main' ||
      vars.RELEASE_BOT_USER_ID == '' ||
      format('{0}', github.event.pull_request.user.id) != vars.RELEASE_BOT_USER_ID }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and smoke-test the local image without registry publication
        run: pnpm check:container

  checks:
    name: quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The rollout PR lands the policy. Later PRs use their base copy.
      - name: Check for trusted lint-action policy
        if: github.event_name == 'pull_request'
        id: lint-action-policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          policy_entry=$(git ls-tree "$BASE_SHA" -- .lint-action.json)
          if [[ -n "$policy_entry" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report source quality
        if: github.event_name != 'pull_request' || steps.lint-action-policy.outputs.available == 'true'
        uses: lhajoosten/lint-gate@cd328f5ec8fa196bac2139afe69daf53c8417548

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify formatting, lint, types, and architecture
        if: *needs-full-ci
        run: pnpm check:static

      - name: Build documentation
        if: *needs-full-ci
        run: pnpm docs:build

      - name: Reject stale release proposals
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release-log/main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:release-proposal-source --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm check:pr-title

      - name: Validate non-merge PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:commit-range --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Validate non-merge commits pushed to main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm check:commit-range --from "$BASE_SHA" --to "$HEAD_SHA" --allow-scopes

  tests:
    name: tests (${{ matrix.shard }})
    if: *needs-full-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Node coverage and record file timings
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: pnpm test:shards run "$TEST_SHARD" 4 tests/file-timings.tsv "$RUNNER_TEMP/shard-$TEST_SHARD.tsv"

      - name: Save timing and test count evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.tsv
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify
    if: ${{ !cancelled() }}
    needs: [checks, tests]
    env:
      FULL_CI: *needs-full-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks and the applicable test result
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          [[ "$CHECKS_RESULT" == success ]] || exit 1
          [[ "$FULL_CI:$TESTS_RESULT" == true:success || "$FULL_CI:$TESTS_RESULT" == false:skipped ]]

      - name: Check out source without persisted credentials
        if: *needs-full-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: *needs-full-ci
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        if: *needs-full-ci
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - name: Download this run's timing reports
        if: *needs-full-ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-test-shard-*
          path: ${{ runner.temp }}/quality-test-shards
          merge-multiple: true

      - name: Verify complete test file coverage
        if: *needs-full-ci
        run: pnpm test:shards verify tests/file-timings.tsv "$RUNNER_TEMP/quality-test-shards"/shard-{1,2,3,4}.tsv
