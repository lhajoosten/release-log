# Copy into .github/workflows/rolling-release.yaml after reviewing settings and provider ref.
name: Rolling Release
run-name: release:${{ github.event.pull_request.number || inputs.retry-pr || 'preview' }}
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      retry-pr:
        description: Merged release PR number to retry (leave empty for preview)
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: write
      pull-requests: write
      packages: write
    uses: ./.github/workflows/release-cycle.yaml
    with:
      retry-pr: ${{ inputs.retry-pr }}
      write-enabled: ${{ vars.RELEASE_LOG_WRITE_ENABLED }}
      bot: ${{ vars.ROLLING_RELEASE_BOT }}
      start-sha: ${{ vars.ROLLING_RELEASE_START_SHA }}
      image-enabled: ${{ vars.ROLLING_RELEASE_IMAGE_ENABLED }}
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  consumer-channel:
    needs: release
    if: always() && !cancelled() && needs.release.outputs.published == 'true' && github.event.pull_request.merged && github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == vars.ROLLING_RELEASE_BOT && vars.RELEASE_LOG_WRITE_ENABLED != 'false' && github.event_name == 'pull_request_target' && github.repository_id == '1449550207' && vars.CONSUMER_PROMOTION_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    concurrency:
      group: rolling-release-provider-channel
      queue: max
    steps:
      - name: Require successful full rehearsal for the exact landing
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_REHEARSAL_READ_TOKEN || github.token }}
          LANDING: ${{ github.event.pull_request.merge_commit_sha }}
          REHEARSAL_REPOSITORY: ${{ vars.CONSUMER_REHEARSAL_REPOSITORY }}
        run: |
          [[ "$LANDING" =~ ^[a-f0-9]{40}$ && "$REHEARSAL_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          gh api "repos/$REHEARSAL_REPOSITORY/actions/workflows/rolling-release-compatibility.yaml/runs?event=workflow_dispatch&branch=main&per_page=100" --paginate --slurp | \
            jq -e --arg sha "$LANDING" '[.[].workflow_runs[] | select(.display_title == ("full:" + $sha))] | sort_by(.id) | last | .status == "completed" and .conclusion == "success"' >/dev/null
      - name: Mint the provider channel token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CONSUMER_PROMOTION_APP_ID }}
          private-key: ${{ secrets.CONSUMER_PROMOTION_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Advance the existing protected channel after verified publication
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LANDING: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          [[ "$LANDING" =~ ^[a-f0-9]{40}$ ]]
          base="repos/$GITHUB_REPOSITORY"
          current=$(gh api "$base/git/ref/heads/consumer-v1" --jq .object.sha)
          [[ "$current" =~ ^[a-f0-9]{40}$ ]]
          relation=$(gh api "$base/compare/$current...$LANDING" --jq .status)
          case "$relation" in
            identical|behind) exit 0 ;;
            ahead) gh api --method PATCH "$base/git/refs/heads/consumer-v1" -f sha="$LANDING" -F force=false --jq .object.sha ;;
            *) echo "The protected provider channel diverged" >&2; exit 1 ;;
          esac
