name: Release promote

on:
  workflow_call:
    inputs:
      retry-pr:
        description: Merged release PR number for a manual retry
        type: string
        default: ""
      bot:
        description: Expected GitHub App bot login
        type: string
        required: true
      start-sha:
        description: Optional reviewed starting boundary
        type: string
        required: false
        default: ""
      app-id:
        description: GitHub App ID for repository writes
        type: string
        required: true
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rolling-release-${{ github.repository }}
  queue: max

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the reviewed provider runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhajoosten/rolling-release
          ref: ${{ job.workflow_sha }}
          path: tool
          fetch-depth: 0
          persist-credentials: false

      - name: Check out consumer history as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tool/.node-version
          package-manager-cache: false

      - name: Resolve reviewed producer from trusted provider history
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLLING_RELEASE_RETRY_PR: ${{ inputs.retry-pr }}
          ROLLING_RELEASE_BOT: ${{ inputs.bot }}
          RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          RELEASE_PROVIDER_PATH: tool
        run: node "$GITHUB_WORKSPACE/tool/scripts/resolve-release-producer.ts"

      - name: Check out the verified reviewed producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhajoosten/rolling-release
          ref: ${{ steps.producer.outputs.sha }}
          path: tool-reviewed
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: tool/package.json
          cache: false

      - name: Install and build trusted runtime before issuing credentials
        working-directory: tool
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Require provider quality for the exact landing
        if: github.repository_id == '1449550207'
        env:
          GH_TOKEN: ${{ github.token }}
          LANDING_SHA: ${{ steps.producer.outputs.landing }}
        run: |
          [[ "$LANDING_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          for attempt in {1..24}; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-quality.yaml/runs?event=push&head_sha=$LANDING_SHA&per_page=1" --jq '.workflow_runs[0] | if . == null then "pending" elif .status != "completed" then "pending" else .conclusion end')
            if [[ "$result" == success ]]; then exit 0; fi
            if [[ "$result" != pending ]]; then echo "Quality failed for the exact landing" >&2; exit 1; fi
            sleep 15
          done
          echo "Quality did not finish for the exact landing; rerun the original event" >&2
          exit 1

      - name: Build the verified reviewed producer before credentials
        working-directory: tool-reviewed
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Mint scoped repository token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: read

      - name: Run promote against the consumer
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ROLLING_RELEASE_RETRY_PR: ${{ inputs.retry-pr }}
          ROLLING_RELEASE_BOT: ${{ inputs.bot }}
          ROLLING_RELEASE_START_SHA: ${{ inputs.start-sha }}
          ROLLING_RELEASE_REVIEW_RUNTIME: ${{ github.workspace }}/tool-reviewed
          ROLLING_RELEASE_REVIEW_SHA: ${{ steps.producer.outputs.sha }}
          ROLLING_RELEASE_REVIEW_HEAD: ${{ steps.producer.outputs.head }}
        run: node "$GITHUB_WORKSPACE/tool/dist/src/cli.js" promote
