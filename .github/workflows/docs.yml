name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      skip: ${{ steps.inputs.outputs.skip }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check documentation inputs
        id: inputs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pending runs can be replaced. Only skip when the deployed inputs match.
          deployments="repos/$GITHUB_REPOSITORY/deployments"
          if ! latest="$(timeout 15s gh api "$deployments?environment=github-pages&per_page=1" \
            --jq '.[0] | select(. != null) | [.id, .sha] | @tsv')" ||
            ! IFS=$'\t' read -r deployment_id deployed_sha <<< "$latest" ||
            [[ ! "$deployment_id" =~ ^[0-9]+$ || ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] ||
            ! state="$(timeout 15s gh api "$deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state')" ||
            [[ "$state" != success ]]; then
            echo 'No confirmed Pages deployment baseline. Building documentation.'
            exit 0
          fi
          if ! git diff --quiet "$deployed_sha" "$GITHUB_SHA" -- docs .github/workflows/docs.yml .node-version pnpm-lock.yaml pnpm-workspace.yaml patches; then
            exit 0
          fi
          # The site does not use the package version. Keep rebuilds for other manifest changes.
          if ! deployed_manifest="$(git show "$deployed_sha:package.json" | jq -cSe 'del(.version)')" ||
            ! current_manifest="$(git show "$GITHUB_SHA:package.json" | jq -cSe 'del(.version)')" ||
            [[ "$deployed_manifest" != "$current_manifest" ]]; then
            exit 0
          fi
          echo 'skip=true' >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: &build-docs steps.inputs.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        if: *build-docs
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        if: *build-docs
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build documentation
        if: *build-docs
        run: pnpm docs:build

      - name: Upload Pages artifact
        if: *build-docs
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.skip != 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
