name: Promote compatible consumer workflow

on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: consumer-v1-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.repository_id == '1449550207' &&
      vars.CONSUMER_PROMOTION_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/quality.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the exact candidate still matches provider main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
          QUALITY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ && "$QUALITY_RUN" =~ ^[1-9][0-9]*$ ]]
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main" == "$CANDIDATE" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Quality passed for $CANDIDATE. A newer main revision is awaiting its own result."
          fi

      - name: Mint a provider-only ref promotion token
        if: steps.candidate.outputs.eligible == 'true'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CONSUMER_PROMOTION_APP_ID }}
          private-key: ${{ secrets.CONSUMER_PROMOTION_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Record the reviewed producer, then advance the stable ref
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
          QUALITY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          base="repos/$GITHUB_REPOSITORY/git"
          main=$(gh api "$base/ref/heads/main" --jq .object.sha)
          [[ "$main" == "$CANDIDATE" ]] || exit 0
          producer="tags/rolling-release-producer/$CANDIDATE"
          gh api --method POST "$base/refs" -f "ref=refs/$producer" -f "sha=$CANDIDATE" >/dev/null ||
            echo "Verifying whether the producer record already exists"

          record=$(gh api "$base/ref/$producer" --jq '.object.type + " " + .object.sha')
          test "$record" = "commit $CANDIDATE"

          # The branch must already exist and this operation must remain a fast-forward.
          stable=$(gh api --method PATCH "$base/refs/heads/consumer-v1" \
            -f "sha=$CANDIDATE" -F force=false --jq .object.sha)
          test "$stable" = "$CANDIDATE"
          printf 'Promoted %s via Quality run %s\n' "$stable" "$QUALITY_RUN" >> "$GITHUB_STEP_SUMMARY"
