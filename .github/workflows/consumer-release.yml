name: Rolling Release consumer

on:
  workflow_call:
    inputs:
      release-branch:
        type: string
        required: true
      app-id:
        type: string
        required: true
      bot-user-id:
        type: string
        required: true
      write-enabled:
        description: Set false to pause merge writes
        type: boolean
        default: true
      configuration:
        description: Deprecated inline configuration for migration
        type: string
      replay-history:
        description: Deprecated replay records, checked against the provider catalog
        type: string
    secrets:
      app-private-key:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve trusted consumer settings
    if: >-
      github.event.repository.default_branch == inputs.release-branch &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', inputs.release-branch)) ||
       (github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' && github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == inputs.release-branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      configuration: ${{ steps.settings.outputs.configuration }}
      historical: ${{ steps.settings.outputs.historical }}
      runtimes: ${{ steps.settings.outputs.runtimes }}
      settings-source: ${{ steps.settings.outputs.source }}
    steps:
      - name: Check out this reusable workflow's reviewed provider revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhajoosten/rolling-release
          ref: ${{ job.workflow_sha }}
          path: tool
          persist-credentials: false

      - name: Record the resolved provider revision
        id: revision
        env:
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$TOOL_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C tool rev-parse HEAD)" = "$TOOL_SHA"
          printf 'sha=%s\n' "$TOOL_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out only trusted release-branch data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/heads/{0}', inputs.release-branch) }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tool/.node-version
          package-manager-cache: false

      - name: Resolve settings and reviewed historical producer pins
        id: settings
        working-directory: tool
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          TOOL_SHA: ${{ steps.revision.outputs.sha }}
          INLINE_CONFIGURATION: ${{ inputs.configuration }}
          INLINE_REPLAY_HISTORY: ${{ inputs.replay-history }}
        run: node scripts/resolve-consumer-release.ts

  release:
    name: Run the reviewed release controller
    needs: resolve
    uses: ./.github/workflows/rolling-release.yml
    with:
      tool-sha: ${{ needs.resolve.outputs.revision }}
      verification-runtimes: ${{ needs.resolve.outputs.runtimes }}
      historical-configurations: ${{ needs.resolve.outputs.historical }}
      release-branch: ${{ inputs.release-branch }}
      app-id: ${{ inputs.app-id }}
      bot-user-id: ${{ inputs.bot-user-id }}
      configuration: ${{ needs.resolve.outputs.configuration }}
      consumer: true
      settings-source: ${{ needs.resolve.outputs.settings-source }}
      write: ${{ inputs.write-enabled && github.event_name != 'workflow_dispatch' }}
    secrets:
      app-private-key: ${{ secrets.app-private-key }}
