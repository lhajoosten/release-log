name: CI shard pilot

on:
  pull_request:
    paths:
      - .github/workflows/ci-shard-pilot.yml
      - scripts/test-file-reporter.ts
      - scripts/test-shards.ts
      - tests/file-timings.tsv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-shard-pilot-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pilot tests (${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        run: [baseline, 1, 2, 3, 4]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          cache: true

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Node coverage and record file timings
        env:
          PILOT_RUN: ${{ matrix.run }}
        run: |
          if [[ "$PILOT_RUN" == baseline ]]; then
            node scripts/test-shards.ts record "$RUNNER_TEMP/shard-baseline.tsv"
          else
            node scripts/test-shards.ts run "$PILOT_RUN" 4 tests/file-timings.tsv "$RUNNER_TEMP/shard-$PILOT_RUN.tsv"
          fi

      - name: Save timing and test count evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-pilot-${{ matrix.run }}
          path: ${{ runner.temp }}/shard-${{ matrix.run }}.tsv
          if-no-files-found: error
          retention-days: 7

  check:
    name: Compare shard reports with the baseline
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download this run's timing reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-pilot-*
          path: ${{ runner.temp }}/shard-pilot
          merge-multiple: true

      - name: Verify each file and test count
        run: node scripts/test-shards.ts verify "$RUNNER_TEMP/shard-pilot/shard-baseline.tsv" "$RUNNER_TEMP/shard-pilot"/shard-{1,2,3,4}.tsv
