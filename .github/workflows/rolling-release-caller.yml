# Live proposal/tag/GitHub Release writes are enabled; release PRs require human merge.
name: Rolling release caller

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    uses: lhajoosten/release-log/.github/workflows/rolling-release.yml@a4b2a83bc9bad1a0187c174215d144e7e9db824f
    with:
      tool-sha: a4b2a83bc9bad1a0187c174215d144e7e9db824f
      verification-runtimes: >-
        [{"sha":"e3f2d317370447f6608be17941ade53b099d8fd2","legacy":false},{"sha":"8828be515345d761a7375b5c00b1beff0cfabaeb","legacy":true}]
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write: true
      configuration: >-
        {"schemaVersion":2,"repository":"lhajoosten/release-log","repositoryId":1449550207,"releaseBranch":"main","releasePolicy":"release-policy-v1","contextPolicy":"required","selfUpgrade":true,"githubRelease":true,"changelog":{"verbosity":"concise","format":"compact"},"bootstrap":{"baselineSha":"bb0033fb274e69a8aabad6a17d71f18ec9292f60","onboardingSha":"c28fe6faa4d516847fbc725e9186cc80ac8873af"},"adoptedRelease":{"pullNumber":83,"headSha":"35363260d66053716354266d184b1b7bbec11f2a","landingSha":"bb9bf88a467e32e9532521737b53464706052f15","commitSha":"33e397fce7b4993a7e001966b612116beaae7520","tag":"v0.3.0"}}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
