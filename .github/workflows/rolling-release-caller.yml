# Live proposal/tag writes are enabled; generated release PRs require human merge.
name: Rolling release caller

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    uses: lhajoosten/release-log/.github/workflows/rolling-release.yml@2a72b57d983067308ec0198ba7977586683351e1
    with:
      tool-sha: 2a72b57d983067308ec0198ba7977586683351e1
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write: true
      configuration: >-
        {"schemaVersion":2,"repository":"lhajoosten/release-log","repositoryId":1449550207,"releaseBranch":"main","releasePolicy":"release-policy-v1","contextPolicy":"required","changelog":{"verbosity":"concise"},"bootstrap":{"baselineSha":"bb0033fb274e69a8aabad6a17d71f18ec9292f60","onboardingSha":"c28fe6faa4d516847fbc725e9186cc80ac8873af"}}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
